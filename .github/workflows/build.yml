name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # Needed for uploading assets to GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cxx: g++

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            cxx: clang++

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            cxx: clang++ -arch x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for git describe and git rev-parse

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BINARY_NAME: vig-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GIT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          DIRTY="false"
          if [ -n "$(git status --porcelain -uno 2>/dev/null)" ]; then
              DIRTY="true"
          fi

          LDFLAGS="-s -w \
            -X github.com/firstrow/wig/version.Version=${GIT_VERSION} \
            -X github.com/firstrow/wig/version.CommitHash=${COMMIT_HASH} \
            -X github.com/firstrow/wig/version.Dirty=${DIRTY}"

          echo "Building ${BINARY_NAME} (commit: ${COMMIT_HASH}, version: ${GIT_VERSION:-none})"
          go build -ldflags "${LDFLAGS}" -o "${BINARY_NAME}" ./cmd
          chmod +x "${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vig-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vig-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

      - name: Upload binary to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vig-${{ matrix.goos }}-${{ matrix.goarch }}
