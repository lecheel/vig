name: Build

on:
  push:
    branches: [ "main", "master", "test-*" ] # Allows testing on any test-* branch
    tags: [ "v*", "*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cxx: g++

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          # Windows AMD64 (Cross-compiled with MinGW)
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++

          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            cxx: clang++

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            cxx: clang++ -arch x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install cross-compilers
        if: matrix.os == 'ubuntu-latest' && (matrix.goarch == 'arm64' || matrix.goos == 'windows')
        run: |
          sudo apt-get update
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip
          fi

      - name: Build and package
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GIT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          DIRTY="false"
          if [ -n "$(git status --porcelain -uno 2>/dev/null)" ]; then
              DIRTY="true"
          fi

          LDFLAGS="-s -w \
            -X github.com/firstrow/wig/version.Version=${GIT_VERSION} \
            -X github.com/firstrow/wig/version.CommitHash=${COMMIT_HASH} \
            -X github.com/firstrow/wig/version.Dirty=${DIRTY}"

          # 1. Determine executable extension
          EXE_NAME="vig"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_NAME="vig.exe"
          fi

          echo "Building ${EXE_NAME} for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          go build -ldflags "${LDFLAGS}" -o "${EXE_NAME}" ./cmd

          # 2. Package: .zip for Windows, .tar.gz for Linux/macOS
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE_NAME="vig-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip -9 "${ARCHIVE_NAME}" "${EXE_NAME}"
          else
            chmod +x "${EXE_NAME}"
            ARCHIVE_NAME="vig-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czvf "${ARCHIVE_NAME}" "${EXE_NAME}"
          fi

          # 3. Generate SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vig-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            vig-*.*
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vig-*.zip
            vig-*.tar.gz
            vig-*.sha256
