name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # Needed to publish releases

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cxx: g++

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            cxx: clang++

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            cxx: clang++ -arch x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build and package (.tar.gz)
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GIT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          DIRTY="false"
          if [ -n "$(git status --porcelain -uno 2>/dev/null)" ]; then
              DIRTY="true"
          fi

          LDFLAGS="-s -w \
            -X github.com/firstrow/wig/version.Version=${GIT_VERSION} \
            -X github.com/firstrow/wig/version.CommitHash=${COMMIT_HASH} \
            -X github.com/firstrow/wig/version.Dirty=${DIRTY}"

          # 1. Compile the binary named 'vig'
          go build -ldflags "${LDFLAGS}" -o vig ./cmd
          chmod +x vig

          # 2. Package into .tar.gz
          ARCHIVE_NAME="vig-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" vig

          # 3. Generate SHA256 checksum file
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vig-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            vig-*.tar.gz
            vig-*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vig-*.tar.gz
            vig-*.tar.gz.sha256
